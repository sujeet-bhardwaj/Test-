<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      height: 2000px;
      margin: 0;
      font-family: sans-serif;
    }

    .header-space {
      height: 150px;
      background-color: #f1f2f6;
      padding: 20px;
    }
    .sticky-nav {
      position: sticky;
      top: 0;
      background-color: #2ed573;
      color: white;
      padding: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header-space">
    <h1>My Website Banner</h1>
    <p>Scroll down to see the sticky navbar in action...</p>
  </div>

  <div class="sticky-nav">
    I am Sticky Navigation Bar!
  </div>

  <div style="padding: 20px;">
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    <!-- Extra Content to allow scrolling -->
  </div>

</body>
</html>
